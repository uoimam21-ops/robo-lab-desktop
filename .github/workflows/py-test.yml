# TEMPORARY (21 Nov 2026): run the journey's Python levels with the new editor and real Python once; never merged.
name: py-test
on:
  push:
    branches: [tmp-py-test]
jobs:
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: uoimam21-ops/robo-egypt-site, ref: journey-pyed, token: '${{ secrets.SITE_READ_TOKEN }}', path: site }
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd site && npm ci && npm run build
      - run: |
          mkdir -p /tmp/py && cd /tmp/py && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          cp $GITHUB_WORKSPACE/app/.github/py-test/* . && npx playwright install --with-deps chromium >/dev/null
      - name: solve Python levels
        run: |
          (cd site/dist && python3 -m http.server 8812 >/dev/null 2>&1 &) ; sleep 2
          cd /tmp/py && node run.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: py-shots, path: /tmp/py/*.png }
