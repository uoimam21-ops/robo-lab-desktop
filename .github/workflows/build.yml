# Builds the Windows installers, the Mac apps and the Android app, installs each one and tests it (offline, labs, Python,
# Arduino compile) on every pull request and push to main. A release (a tag like v1.1.0, or the nightly site update in
# nightly.yml calling this with «tag») also publishes the files, with the update file (latest.yml) the Windows app reads.
# The repository is public, so GitHub's machines cost nothing here.
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  release: { types: [published] }
  workflow_dispatch:
  # the nightly site update (nightly.yml): build that commit and publish it as release «tag»
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      ref: { type: string, required: true }
permissions: { contents: write }
env:
  # the release tag when this run publishes one, empty otherwise
  REL_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  # the installed app must not look for updates while it is being tested
  ROBO_NO_UPDATES: '1'
# a release made from GitHub's page can fire both «release» and the tag push: build only once
concurrency: { group: 'build-${{ github.ref }}', cancel-in-progress: true }
jobs:
  windows:
    # Windows Server 2022: on the 2025 image (windows-latest) the silent NSIS installer crashed at start (0xC0000005)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: node scripts/arduino.mjs
      - run: npx electron-builder --win --config build/modern.yml --publish never
      - run: npx electron-builder --win --config build/win7.yml --publish never
      - name: test the app (Windows 10/11 build, not installed)
        shell: pwsh
        run: node tests/smoke.mjs "dist/win10-11/win-unpacked/Robo Journey.exe" win10-11-app
      - name: test the app (Windows 7 build, not installed)
        shell: pwsh
        run: |
          node tests/smoke.mjs "dist/win7/win-unpacked/Robo Journey.exe" win7-app
          if ($LASTEXITCODE -ne 0) { Write-Host "--- again without GPU acceleration ---"; $env:SMOKE_ARGS = "--disable-gpu --in-process-gpu"; node tests/smoke.mjs "dist/win7/win-unpacked/Robo Journey.exe" win7-app-nogpu }
      # the installers: install silently and run the same test on the installed app. A failure here is shown as a warning
      # (the CI machine's silent install has been flaky); try the installer on a real PC before a release.
      - name: test the Windows 10/11 installer
        continue-on-error: true
        shell: pwsh
        run: |
          $s = Get-ChildItem dist/win10-11/*.exe | Select-Object -First 1
          $t0 = (Get-Date).AddMinutes(-1)
          # the silent installer sometimes hangs on the CI machine without installing: give it 5 minutes, then kill it and try again
          for ($try = 1; $try -le 3; $try++) {
            $pr = Start-Process -FilePath $s.FullName -ArgumentList '/S', '/currentuser' -PassThru
            if ($pr.WaitForExit(300000)) { Write-Host "installer finished (try $try, exit $($pr.ExitCode))"; break }
            Write-Host "installer still running after 5 minutes (try $try): killing it"
            Get-Process | Where-Object { $_.Name -like 'Robo-Journey-Setup*' -or $_.Name -like '*nsis*' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          # the installer may hand off to a child process: wait up to 3 minutes for the app to appear
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          for ($i = 0; $i -lt 40 -and -not $exe; $i++) {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem $roots -Recurse -Filter "Robo Journey.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name; Get-Process | Where-Object { $_.Name -like '*Robo*' -or $_.Name -like '*Setup*' } | Format-Table Name, Id }
          if (-not $exe) { Write-Error "Robo Journey.exe not found after installing $($s.Name)"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          # the installer starts the app when it finishes; close it, the app allows a single copy at a time
          # the installer starts the app when it's done (sometimes a few seconds later): close it, or the test's copy exits at once (one copy at a time)
          for ($i = 0; $i -lt 15; $i++) { Get-Process -Name 'Robo Journey' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
          node tests/smoke.mjs "$($exe.FullName)" win10-11
      - name: test the Windows 7 (64-bit) installer
        continue-on-error: true
        shell: pwsh
        run: |
          $s = Get-ChildItem dist/win7/*-win7-x64.exe | Select-Object -First 1
          $t0 = (Get-Date).AddMinutes(-1)
          # the silent installer sometimes hangs on the CI machine without installing: give it 5 minutes, then kill it and try again
          for ($try = 1; $try -le 3; $try++) {
            $pr = Start-Process -FilePath $s.FullName -ArgumentList '/S', '/currentuser' -PassThru
            if ($pr.WaitForExit(300000)) { Write-Host "installer finished (try $try, exit $($pr.ExitCode))"; break }
            Write-Host "installer still running after 5 minutes (try $try): killing it"
            Get-Process | Where-Object { $_.Name -like 'Robo-Journey-Setup*' -or $_.Name -like '*nsis*' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          }
          # the installer may hand off to a child process: wait up to 3 minutes for the app to appear
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          for ($i = 0; $i -lt 40 -and -not $exe; $i++) {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem $roots -Recurse -Filter "Robo Journey.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name; Get-Process | Where-Object { $_.Name -like '*Robo*' -or $_.Name -like '*Setup*' } | Format-Table Name, Id }
          if (-not $exe) { Write-Error "Robo Journey.exe not found after installing $($s.Name)"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          # the installer starts the app when it finishes; close it, the app allows a single copy at a time
          # the installer starts the app when it's done (sometimes a few seconds later): close it, or the test's copy exits at once (one copy at a time)
          for ($i = 0; $i -lt 15; $i++) { Get-Process -Name 'Robo Journey' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
          node tests/smoke.mjs "$($exe.FullName)" win7-x64
          if ($LASTEXITCODE -ne 0) { Write-Host "--- again without GPU acceleration ---"; $env:SMOKE_ARGS = "--disable-gpu --in-process-gpu"; node tests/smoke.mjs "$($exe.FullName)" win7-x64-nogpu }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Robo-Journey-installers
          path: |
            dist/win10-11/*.exe
            dist/win7/*.exe
      - if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: |
            dist/win10-11/*.exe
            dist/win7/*.exe
      # public downloads: the same installers on github.com/uoimam21-ops/robo-lab-download, with fixed names so the
      # website can always link to …/releases/latest/download/Robo-Journey-Setup-win10-11.exe
      - if: env.REL_TAG != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public-files | Out-Null
          Copy-Item (Get-ChildItem dist/win10-11/*-win10-11.exe | Select-Object -First 1) public-files/Robo-Journey-Setup-win10-11.exe
          Copy-Item (Get-ChildItem dist/win7/*-win7-x64.exe | Select-Object -First 1) public-files/Robo-Journey-Setup-win7-64bit.exe
          Copy-Item (Get-ChildItem dist/win7/*-win7-ia32.exe | Select-Object -First 1) public-files/Robo-Journey-Setup-win7-32bit.exe
          # the Windows 10/11 app updates itself from these (electron-updater reads latest.yml, then the installer it names)
          New-Item -ItemType Directory -Force public-update | Out-Null
          Copy-Item dist/win10-11/latest.yml, dist/win10-11/*-win10-11.exe, dist/win10-11/*-win10-11.exe.blockmap public-update/
      - if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: uoimam21-ops/robo-lab-download
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.REL_TAG }}
          name: Robo Journey ${{ env.REL_TAG }}
          make_latest: 'true'
          body: |
            ## رحلة روبو (Robo Journey): الرحلة وكل المختبرات
            كل مختبرات Robo Egypt من غير إنترنت، ورفع الكود على أردوينو حقيقي.

            | الجهاز | الملف |
            |---|---|
            | ويندوز ١٠ و ١١ | `Robo-Journey-Setup-win10-11.exe` |
            | ويندوز ٧ و ٨ (٦٤ بت) | `Robo-Journey-Setup-win7-64bit.exe` |
            | ويندوز ٧ و ٨ (٣٢ بت) | `Robo-Journey-Setup-win7-32bit.exe` |
            | ماك Apple Silicon (M1 وأحدث) | `Robo-Journey-mac-apple-silicon.dmg` |
            | ماك Intel | `Robo-Journey-mac-intel.dmg` |

            لو ويندوز قال «Windows protected your PC»: دوس **More info** وبعدين **Run anyway**.
            على الماك أول مرة: كليك يمين على Robo Journey ← **Open**. (macOS 15: System Settings ← Privacy & Security ← **Open Anyway**.)
          files: |
            public-files/*.exe
            public-update/*
  # macOS: one app per kind of Mac, each built (and tested) on that kind of Mac, because the Arduino tools differ
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, label: apple-silicon }
          - { runner: macos-15-intel, arch: x64, label: intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50   # a stuck Mac job blocked the queue for hours before
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: node scripts/arduino.mjs
      - run: npx electron-builder --mac --${{ matrix.arch }} --config build/mac.yml --publish never
      - name: test the Mac app
        run: |
          APP=$(find dist/mac -maxdepth 3 -name "Robo Journey.app" -type d | head -1)
          echo "app: $APP"
          node tests/smoke.mjs "$APP/Contents/MacOS/Robo Journey" mac-${{ matrix.label }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-mac-${{ matrix.label }}
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Robo-Journey-mac-${{ matrix.label }}
          path: dist/mac/*.dmg
      - if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: dist/mac/*.dmg
      - if: env.REL_TAG != ''
        run: mkdir -p public-files && cp dist/mac/*.dmg "public-files/Robo-Journey-mac-${{ matrix.label }}.dmg"
      - if: env.REL_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: uoimam21-ops/robo-lab-download
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.REL_TAG }}
          files: public-files/*.dmg
  # Android (Capacitor): debug APK tested on an emulator; with the upload key in secrets, a signed AAB for Google Play
  # and a signed APK for direct download. Secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run vendor
      - run: npm run mobile
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: upload key (from secrets)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: signed release (AAB for Google Play + APK)
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon bundleRelease assembleRelease
      - name: collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Robo-Journey-android-test.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab out/Robo-Journey-android.aab
            cp android/app/build/outputs/apk/release/app-release.apk out/Robo-Journey-android.apk
          fi
          ls -la out
      - name: enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # plain Android (no Google Play services): on the emulator those services crash under load and take the app down with them
          target: default
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: adb install -r out/Robo-Journey-android-test.apk && (node tests/android.mjs; r=$?; adb logcat -d > test-results/android/logcat.txt; exit $r)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-android
          path: test-results/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Robo-Journey-android
          path: out/
      - if: env.REL_TAG != '' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ inputs.ref || github.sha }}
          files: |
            out/Robo-Journey-android.aab
            out/Robo-Journey-android.apk
      - if: env.REL_TAG != '' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: uoimam21-ops/robo-lab-download
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.REL_TAG }}
          files: out/Robo-Journey-android.apk
