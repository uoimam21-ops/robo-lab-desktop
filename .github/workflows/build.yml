# Builds the Windows installers on every push to main (as a downloadable artifact), installs each one on this
# Windows machine and tests the installed app (offline, labs, Python, Arduino compile).
# Publishing a Release on GitHub (Releases → Draft a new release → tag v1.0.0 → Publish) builds, tests and attaches them.
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  release: { types: [published] }
  workflow_dispatch:
permissions: { contents: write }
# a release made from GitHub's page can fire both «release» and the tag push: build only once
concurrency: { group: 'build-${{ github.ref }}', cancel-in-progress: true }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: node scripts/arduino.mjs
      - run: npx electron-builder --win --config build/modern.yml --publish never
      - run: npx electron-builder --win --config build/win7.yml --publish never
      - name: test the Windows 10/11 installer
        shell: pwsh
        run: |
          $s = Get-ChildItem dist/win10-11/*.exe | Select-Object -First 1
          $t0 = (Get-Date).AddMinutes(-1)
          Start-Process -FilePath $s.FullName -ArgumentList '/S', '/currentuser' -Wait
          # the installer may hand off to a child process: wait up to 3 minutes for the app to appear
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          for ($i = 0; $i -lt 90 -and -not $exe; $i++) {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem $roots -Recurse -Filter "Robo Lab.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name; Get-Process | Where-Object { $_.Name -like '*Robo*' -or $_.Name -like '*Setup*' } | Format-Table Name, Id }
          if (-not $exe) { Write-Error "Robo Lab.exe not found after installing $($s.Name)"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          # the installer starts the app when it finishes; close it, the app allows a single copy at a time
          Get-Process | Where-Object { $_.Path -eq $exe.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3
          node tests/smoke.mjs "$($exe.FullName)" win10-11
      - name: test the Windows 7 (64-bit) installer
        shell: pwsh
        run: |
          $s = Get-ChildItem dist/win7/*-win7-x64.exe | Select-Object -First 1
          $t0 = (Get-Date).AddMinutes(-1)
          Start-Process -FilePath $s.FullName -ArgumentList '/S', '/currentuser' -Wait
          # the installer may hand off to a child process: wait up to 3 minutes for the app to appear
          $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
          $exe = $null
          for ($i = 0; $i -lt 90 -and -not $exe; $i++) {
            Start-Sleep -Seconds 2
            $exe = Get-ChildItem $roots -Recurse -Filter "Robo Lab.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Format-Table Name; Get-Process | Where-Object { $_.Name -like '*Robo*' -or $_.Name -like '*Setup*' } | Format-Table Name, Id }
          if (-not $exe) { Write-Error "Robo Lab.exe not found after installing $($s.Name)"; exit 1 }
          Write-Host "installed: $($exe.FullName)"
          # the installer starts the app when it finishes; close it, the app allows a single copy at a time
          Get-Process | Where-Object { $_.Path -eq $exe.FullName } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3
          node tests/smoke.mjs "$($exe.FullName)" win7-x64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Robo-Lab-installers
          path: |
            dist/win10-11/*.exe
            dist/win7/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win10-11/*.exe
            dist/win7/*.exe
      # public downloads: the same installers on github.com/uoimam21-ops/robo-lab-download, with fixed names so the
      # website can always link to …/releases/latest/download/Robo-Lab-Setup-win10-11.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force public-files | Out-Null
          Copy-Item (Get-ChildItem dist/win10-11/*-win10-11.exe | Select-Object -First 1) public-files/Robo-Lab-Setup-win10-11.exe
          Copy-Item (Get-ChildItem dist/win7/*-win7-x64.exe | Select-Object -First 1) public-files/Robo-Lab-Setup-win7-64bit.exe
          Copy-Item (Get-ChildItem dist/win7/*-win7-ia32.exe | Select-Object -First 1) public-files/Robo-Lab-Setup-win7-32bit.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: uoimam21-ops/robo-lab-download
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Robo Lab ${{ github.ref_name }}
          make_latest: 'true'
          body: |
            ## Robo Lab: مختبر روبو للويندوز
            كل مختبرات Robo Egypt من غير إنترنت، ورفع الكود على أردوينو حقيقي.

            | الجهاز | الملف |
            |---|---|
            | ويندوز ١٠ و ١١ | `Robo-Lab-Setup-win10-11.exe` |
            | ويندوز ٧ و ٨ (٦٤ بت) | `Robo-Lab-Setup-win7-64bit.exe` |
            | ويندوز ٧ و ٨ (٣٢ بت) | `Robo-Lab-Setup-win7-32bit.exe` |

            لو ويندوز قال «Windows protected your PC»: دوس **More info** وبعدين **Run anyway**.
          files: public-files/*.exe
