# Builds the Windows installers. Runs on every push to main; a tag like v1.0.0 also publishes them as a GitHub Release.
name: build
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run vendor
      - run: node scripts/arduino.mjs
      - run: npx electron-builder --win --config build/modern.yml --publish never
      - run: npx electron-builder --win --config build/win7.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Robo-Lab-installers
          path: |
            dist/win10-11/*.exe
            dist/win7/*.exe
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win10-11/*.exe
            dist/win7/*.exe
