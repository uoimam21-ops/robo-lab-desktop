# Windows 10 / 11 (Electron from package.json)
appId: com.roboegypt.lab
productName: Robo Journey
copyright: Robo Egypt
# makes latest.yml next to the installer: the Windows 10/11 app updates itself from that release (electron/updates.js)
publish: { provider: github, owner: uoimam21-ops, repo: robo-lab-download }
directories: { output: dist/win10-11, buildResources: build }
files: [electron/**, launcher/**, www/**, package.json, "!**/*.map"]
asar: false
# compiler + boards + libraries for «upload to Arduino» (made by scripts/arduino.mjs)
extraResources: [{ from: arduino, to: arduino }]
win:
  icon: build/icon.ico
  target: [{ target: nsis, arch: [x64] }]
  artifactName: Robo-Journey-Setup-${version}-win10-11.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: رحلة روبو
  installerLanguages: [ar_SA, en_US]
  language: "1025"
