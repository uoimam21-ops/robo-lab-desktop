<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mr1-fsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="250" y="30" width="140" height="40" rx="6" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="320.0" y="54.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">FOLLOW</text><rect x="250" y="150" width="140" height="40" rx="6" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="320.0" y="174.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">SEARCH</text><line x1="300" y1="72" x2="300" y2="148" stroke="#d14b4b" stroke-width="1.5" marker-end="url(#mr1-fsm)"/><line x1="340" y1="148" x2="340" y2="72" stroke="#1f9d74" stroke-width="1.5" marker-end="url(#mr1-fsm)"/><text x="230" y="115" direction="rtl" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="400">الـ 3 حساسات مش شايفين</text><text x="440" y="115" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="400">أي حساس شاف الخط</text><text x="320" y="18" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">L → turn left · R → turn right · C → straight</text><text x="320" y="212" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">spin toward last_side</text><text x="80" y="60" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">الذاكرة:</text><text x="80" y="80" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#7a4fd1" font-weight="700">last_side</text></svg>