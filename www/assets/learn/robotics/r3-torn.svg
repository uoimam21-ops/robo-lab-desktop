<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mr3-torn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="320" y="22" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">ticks = 255 = 0x00FF   (16 bit = 2 bytes)</text><rect x="440" y="45" width="180" height="46" rx="6" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="530.0" y="72.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">lds r24 ← low byte</text><text x="530" y="112" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#2f6fd6" font-weight="700">0xFF</text><line x1="438" y1="68" x2="422" y2="68" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr3-torn)"/><rect x="240" y="45" width="180" height="46" rx="6" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="330.0" y="72.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">ISR: ++ticks</text><text x="330" y="112" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#d14b4b" font-weight="700">256 = 0x0100</text><line x1="238" y1="68" x2="222" y2="68" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr3-torn)"/><rect x="40" y="45" width="180" height="46" rx="6" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="130.0" y="72.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">lds r25 ← high byte</text><text x="130" y="112" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#2f6fd6" font-weight="700">0x01</text><rect x="220" y="140" width="200" height="40" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="320.0" y="164.0" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">loop sees 0x01FF = 511</text><text x="320" y="205" direction="rtl" text-anchor="middle" font-size="11" fill="#d14b4b" font-weight="700">لما الـ interrupt جه بين نصين القراءة، ظهر رقم 511 عمره ما كان موجود، والحلقة خرجت بدري</text></svg>