<svg direction="ltr" viewBox="0 0 640 184" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mr3-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="140" y="37" font-family="JetBrains Mono" text-anchor="end" font-size="11" fill="#1b2130" font-weight="700">strings in RAM</text><rect x="150" y="20" width="81.6" height="24" rx="4" fill="#d14b4b" opacity=".85"/><text x="237.640625" y="37" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#d14b4b" font-weight="700">440 B</text><text x="140" y="75" font-family="JetBrains Mono" text-anchor="end" font-size="11" fill="#1b2130" font-weight="700">with F()</text><rect x="150" y="58" width="35.6" height="24" rx="4" fill="#1f9d74" opacity=".85"/><text x="191.625" y="75" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#1f9d74" font-weight="700">192 B</text><text x="140" y="113" font-family="JetBrains Mono" text-anchor="end" font-size="11" fill="#1b2130" font-weight="700">all RAM</text><rect x="150" y="96" width="380.0" height="24" rx="4" fill="#5d6678" opacity=".85"/><text x="536.0" y="113" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#5d6678" font-weight="700">2,048 B</text><text x="320.0" y="170" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">نفس البرنامج، بس مع F(): اتنقل 248 بايت من الـ RAM للـ flash، يعني 12% من كل الذاكرة</text></svg>