<svg direction="ltr" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mr3-tinyml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="20" y="60" width="120" height="56" rx="6" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="80.0" y="92.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">accel window</text><text x="80" y="132" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">32 × 3 int8</text><rect x="170" y="60" width="120" height="56" rx="6" fill="#f3effc" stroke="#7a4fd1" stroke-width="1.5"/><text x="230.0" y="92.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">features</text><text x="230" y="132" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">12 integers</text><rect x="320" y="60" width="140" height="56" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="390.0" y="92.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">int8 net 12→8→4</text><text x="390" y="132" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">176 bytes</text><rect x="490" y="60" width="130" height="56" rx="6" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="555.0" y="92.0" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">gesture</text><text x="555" y="132" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">95 / 100</text><line x1="142" y1="88" x2="168" y2="88" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr3-tinyml)"/><line x1="292" y1="88" x2="318" y2="88" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr3-tinyml)"/><line x1="462" y1="88" x2="488" y2="88" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr3-tinyml)"/><text x="320" y="165" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">~2 ms per window on a 16 MHz Arduino Uno (simavr)</text><text x="320" y="198" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">الذكاء الاصطناعي على شريحة بـ 2 كيلوبايت ذاكرة: مقاييس بسيطة، وشبكة صغيرة بأرقام صحيحة</text></svg>