<svg direction="ltr" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mr1-sta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="40" y="80" width="150" height="50" rx="6" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="115.0" y="109.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">الإحساس (Sense)</text><rect x="245" y="80" width="150" height="50" rx="6" fill="#f3effc" stroke="#7a4fd1" stroke-width="1.5"/><text x="320.0" y="109.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">التفكير (Think)</text><rect x="450" y="80" width="150" height="50" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="525.0" y="109.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">الفعل (Act)</text><text x="115" y="150" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">sensors</text><text x="320" y="150" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">code</text><text x="525" y="150" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">motors</text><line x1="192" y1="105" x2="243" y2="105" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr1-sta)"/><line x1="397" y1="105" x2="448" y2="105" stroke="#5d6678" stroke-width="1.6" marker-end="url(#mr1-sta)"/><path d="M525,78 C525,20 115,20 115,78" fill="none" stroke="#1f9d74" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#mr1-sta)"/><text x="320" y="34" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="400">العالم اتغيّر بسبب الحركة، والحساسات بتقيس من تاني</text><text x="320" y="200" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">كل روبوت، من مكنسة لحد humanoid: الحلقة دي بتتكرر عشرات أو آلاف المرات في الثانية</text></svg>