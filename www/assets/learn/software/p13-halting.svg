<svg direction="ltr" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m13halting" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="220" y="15" width="200" height="44" rx="8" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="320" y="42" font-family="JetBrains Mono" text-anchor="middle" font-size="12" fill="#c97c00" font-weight="700">paradox(p)</text><rect x="220" y="85" width="200" height="44" rx="8" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="320" y="105" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">halts(p, p) ?</text><text x="320" y="122" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">اسأل «العرّاف»</text><line x1="320" y1="61" x2="320" y2="83" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m13halting)"/><rect x="40" y="165" width="200" height="44" rx="8" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="140" y="185" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="700">while True: pass</text><text x="140" y="201" direction="rtl" text-anchor="middle" font-size="9.5" fill="#d14b4b" font-weight="400">لو قال «هيقف» ← لف للأبد</text><rect x="400" y="165" width="200" height="44" rx="8" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="500" y="185" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">return</text><text x="500" y="201" direction="rtl" text-anchor="middle" font-size="9.5" fill="#1f9d74" font-weight="400">لو قال «هيلف» ← اقف</text><line x1="260" y1="131" x2="170" y2="163" stroke="#d14b4b" stroke-width="1.6" marker-end="url(#m13halting)"/><line x1="380" y1="131" x2="470" y2="163" stroke="#1f9d74" stroke-width="1.6" marker-end="url(#m13halting)"/><text x="320" y="236" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">لو شغّلت paradox على نفسه: أيًا كانت إجابة halts، هو بيعمل عكسها. يبقى مفيش halts صح ممكن يتكتب</text></svg>