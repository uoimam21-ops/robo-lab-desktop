<svg direction="ltr" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic">
  <g font-size="12" fill="#5d6678" direction="rtl" text-anchor="start">
    <text x="630" y="48">الحرف</text><text x="630" y="98">Code point</text><text x="630" y="148">بايتات UTF-8</text>
  </g>
  <g font-family="JetBrains Mono" font-size="12" text-anchor="middle">
