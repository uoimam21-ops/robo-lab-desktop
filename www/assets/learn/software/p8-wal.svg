k)</text><text x="500" y="76" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">ممكن الصفحات تكون اتكتبت</text><text x="500" y="94" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">أو لسه، أو نصها</text><text x="500" y="132" direction="rtl" text-anchor="middle" font-size="11" fill="#c97c00" font-weight="700">Recovery:</text><text x="500" y="150" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">REDO T7 (عمل COMMIT)</text><text x="500" y="168" direction="rtl" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="700">UNDO T8 (مخلصش)</text><line x1="302" y1="110" x2="378" y2="110" stroke="#c97c00" stroke-width="2" marker-end="url(#m8wal)"/><text x="320" y="208" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">القاعدة: سجّل في الـ log الأول (وفي الهارد فعلًا)، وبعدين عدّل البيانات براحتك</text></svg>