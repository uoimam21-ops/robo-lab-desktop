<g direction="rtl" font-size="13" fill="#1b2130"><text x="620" y="50" text-anchor="start">الساعة 10 الصبح + 5 ساعات = 3 العصر</text><text x="620" y="80" text-anchor="end" font-family="JetBrains Mono" direction="ltr">(10 + 5) mod 12 = 3</text><text x="620" y="120" text-anchor="start">15 و 3 و 27 «نفس المكان» على الساعة:</text><text x="620" y="150" text-anchor="end" font-family="JetBrains Mono" direction="ltr">15 ≡ 3 ≡ 27  (mod 12)</text><text x="620" y="190" text-anchor="start" fill="#5d6678" font-size="11.5">الحساب ده هو أساس RSA و Diffie–Hellman والـ hashing</text></g></svg>