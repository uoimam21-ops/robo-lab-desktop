<svg direction="ltr" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m15quorum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="120" y="40" width="250" height="80" rx="14" fill="#fff6e5" stroke="#c97c00" stroke-width="1.8" opacity=".9"/><rect x="270" y="55" width="250" height="80" rx="14" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.8" opacity=".75"/><circle cx="170" cy="88" r="24" fill="#fff" stroke="#1b2130" stroke-width="1.6"/><text x="170" y="93" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">R1</text><circle cx="320" cy="88" r="24" fill="#fff" stroke="#1b2130" stroke-width="1.6"/><text x="320" y="93" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">R2</text><circle cx="470" cy="88" r="24" fill="#fff" stroke="#1b2130" stroke-width="1.6"/><text x="470" y="93" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">R3</text><text x="190" y="34" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#c97c00" font-weight="700">write W=2</text><text x="450" y="152" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#2f6fd6" font-weight="700">read R=2</text><text x="320" y="180" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">لو R + W أكبر من N، أي مجموعة قراية لازم «تتقاطع» مع آخر مجموعة كتابة، فواحدة على الأقل عندها النسخة الجديدة</text></svg>