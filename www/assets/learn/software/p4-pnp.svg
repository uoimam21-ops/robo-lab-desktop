<svg direction="ltr" viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m4pnp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><ellipse cx="190" cy="125" rx="172" ry="100" fill="#f3effc" stroke="#7a4fd1" stroke-width="2"/><ellipse cx="120" cy="135" rx="82" ry="58" fill="#eaf6f1" stroke="#1f9d74" stroke-width="2"/><ellipse cx="282" cy="125" rx="66" ry="55" fill="#fdecec" stroke="#d14b4b" stroke-width="2"/><text x="190" y="45" font-family="JetBrains Mono" text-anchor="middle" font-size="16" fill="#7a4fd1" font-weight="700">NP</text><text x="190" y="62" direction="rtl" text-anchor="middle" font-size="10.5" fill="#7a4fd1" font-weight="400">الحل يتأكد منه بسرعة</text><text x="120" y="110" font-family="JetBrains Mono" text-anchor="middle" font-size="16" fill="#1f9d74" font-weight="700">P</text><text x="120" y="128" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="400">يتحل بسرعة</text><text x="120" y="150" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">sorting · paths</text><text x="120" y="164" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">MST · 2-coloring</text><text x="282" y="105" font-family="JetBrains Mono" text-anchor="middle" font-size="11.5" fill="#d14b4b" font-weight="700">NP-Complete</text><text x="282" y="125" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">SAT · TSP</text><text x="282" y="139" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">3-coloring</text><text x="282" y="153" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">Sudoku n×n</text><text x="632" y="70" direction="rtl" text-anchor="start" font-size="12" fill="#1b2130" font-weight="700">الصورة اللي أغلب العلماء مصدقينها (P ≠ NP)</text><text x="632" y="100" direction="rtl" text-anchor="start" font-size="11.5" fill="#1b2130" font-weight="400">لو أي مسألة في الحمرا اتحلت بسرعة،</text><text x="632" y="118" direction="rtl" text-anchor="start" font-size="11.5" fill="#1b2130" font-weight="400">كل NP تتحل بسرعة، و P = NP</text><text x="632" y="156" direction="rtl" text-anchor="start" font-size="11.5" fill="#d14b4b" font-weight="700">محدش أثبت ولا نفى ده لحد النهارده</text><text x="632" y="174" direction="rtl" text-anchor="start" font-size="11" fill="#5d6678" font-weight="400">جايزة Clay: مليون دولار</text></svg>