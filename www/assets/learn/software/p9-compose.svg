<svg direction="ltr" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m9compose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="160" y="20" direction="rtl" text-anchor="middle" font-size="12" fill="#d14b4b" font-weight="700">وراثة: هو HashSet</text><text x="480" y="20" direction="rtl" text-anchor="middle" font-size="12" fill="#1f9d74" font-weight="700">تركيب: عنده HashSet</text><rect x="30" y="35" width="260" height="130" rx="8" fill="#fff" stroke="#d14b4b" stroke-width="1.5"/><rect x="45" y="48" width="230" height="26" rx="4" fill="#fdecec" stroke="#d14b4b" stroke-width="1"/><text x="160" y="65" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">addAll(3): count += 3</text><line x1="160" y1="76" x2="160" y2="92" stroke="#d14b4b" stroke-width="1.5" marker-end="url(#m9compose)"/><rect x="45" y="94" width="230" height="26" rx="4" fill="#fff" stroke="#c9cfdc" stroke-width="1"/><text x="160" y="111" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">super.addAll → add() ×3</text><rect x="45" y="136" width="230" height="24" rx="4" fill="#fdecec" stroke="#d14b4b" stroke-width="1"/><text x="160" y="152" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#d14b4b" font-weight="700">add() is YOURS: count++ ×3</text><text x="160" y="188" font-family="JetBrains Mono" text-anchor="middle" font-size="12" fill="#d14b4b" font-weight="700">addCount = 6 ✗</text><rect x="350" y="35" width="260" height="130" rx="8" fill="#fff" stroke="#1f9d74" stroke-width="1.5"/><rect x="365" y="48" width="230" height="26" rx="4" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1"/><text x="480" y="65" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">addAll(3): count += 3</text><line x1="480" y1="76" x2="480" y2="92" stroke="#1f9d74" stroke-width="1.5" marker-end="url(#m9compose)"/><rect x="365" y="94" width="230" height="26" rx="4" fill="#fff" stroke="#c9cfdc" stroke-width="1"/><text x="480" y="111" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">s.addAll → s.add() ×3</text><text x="480" y="150" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">مفيش عدّ تاني: الـ add دي مش بتاعتك</text><text x="480" y="188" font-family="JetBrains Mono" text-anchor="middle" font-size="12" fill="#1f9d74" font-weight="700">addCount = 3 ✓</text><text x="320" y="212" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">اسمها fragile base class: الأب بينادي دوالك من جوه من غير ما تعرف</text></svg>