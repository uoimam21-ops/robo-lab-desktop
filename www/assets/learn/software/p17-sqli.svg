<svg direction="ltr" viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mp17-sqli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="320" y="20" direction="rtl" text-anchor="middle" font-size="11.5" fill="#1b2130" font-weight="700">المدخل اللي اتكتب في خانة الاسم</text><rect x="20" y="40" width="175.6" height="30" rx="6" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="107.8" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">SELECT … WHERE name = '</text><rect x="199.6" y="40" width="53.2" height="30" rx="6" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="226.2" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="700">admin'</text><rect x="256.8" y="40" width="31.6" height="30" rx="6" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="272.6" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="700"> --</text><rect x="292.40000000000003" y="40" width="161.20000000000002" height="30" rx="6" fill="#f2f2f2" stroke="#5d6678" stroke-width="1.5"/><text x="373.00000000000006" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="700"> ' AND password = '…'</text><text x="320" y="100" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">الاقتباس قفل الاسم بدري، والشرطتين خلّوا باقي الـ query «تعليق»: كلمة السر اتشالت</text><text x="320" y="135" direction="rtl" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">مع الـ parameters: المدخل كله قيمة واحدة، ومش بيتقرا كـ SQL أبدًا</text></svg>