<svg direction="ltr" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m8hashjoin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="20" y="40" width="150" height="120" rx="8" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="95" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#c97c00" font-weight="700">students</text><text x="95" y="80" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">(الأصغر)</text><text x="95" y="104" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(1, s1)</text><text x="95" y="122" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(2, s2)</text><text x="95" y="140" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(3, s3)</text><line x1="172" y1="100" x2="238" y2="100" stroke="#c97c00" stroke-width="2" marker-end="url(#m8hashjoin)"/><text x="205" y="90" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#c97c00" font-weight="700">1. build</text><rect x="240" y="40" width="160" height="120" rx="8" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="320" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">hash table</text><rect x="260" y="72" width="120" height="22" rx="4" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1"/><text x="320" y="87" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">1 → s1</text><rect x="260" y="98" width="120" height="22" rx="4" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1"/><text x="320" y="113" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">2 → s2</text><rect x="260" y="124" width="120" height="22" rx="4" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1"/><text x="320" y="139" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">3 → s3</text><rect x="470" y="40" width="150" height="120" rx="8" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="545" y="60" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#2f6fd6" font-weight="700">enrollments</text><text x="545" y="80" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">(الأكبر)</text><text x="545" y="104" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(2, Python)</text><text x="545" y="122" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(1, Scratch)</text><text x="545" y="140" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">(2, Robotics)</text><line x1="468" y1="110" x2="402" y2="110" stroke="#2f6fd6" stroke-width="2" marker-end="url(#m8hashjoin)"/><text x="435" y="100" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#2f6fd6" font-weight="700">2. probe</text><text x="320" y="190" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">كل صف في الجدول الكبير بيسأل الـ hash table في خطوة: O(n + m) بدل O(n × m)</text></svg>