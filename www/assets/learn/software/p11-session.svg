ill="#5d6678" font-weight="400">يدوّر على sid</text><text x="320" y="222" direction="rtl" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="700">الـ cookie بيتبعت أوتوماتيك مع كل طلب، وعلامة HttpOnly معناها إن الـ JavaScript ميقدرش يقراه (حماية من XSS)</text></svg>