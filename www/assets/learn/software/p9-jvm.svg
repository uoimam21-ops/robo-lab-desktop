<svg direction="ltr" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m9jvm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="8" y="30" width="110" height="50" rx="8" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="63" y="52" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">Student.java</text><text x="63" y="70" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#5d6678" font-weight="400">source</text><rect x="134" y="30" width="110" height="50" rx="8" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="189" y="52" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#c97c00" font-weight="700">javac</text><text x="189" y="70" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#5d6678" font-weight="400">compiler</text><line x1="119" y1="55" x2="132" y2="55" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m9jvm)"/><rect x="260" y="30" width="110" height="50" rx="8" fill="#f3effc" stroke="#7a4fd1" stroke-width="1.5"/><text x="315" y="52" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#7a4fd1" font-weight="700">Student.class</text><text x="315" y="70" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#5d6678" font-weight="400">bytecode</text><line x1="245" y1="55" x2="258" y2="55" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m9jvm)"/><rect x="386" y="30" width="110" height="50" rx="8" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="441" y="52" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#2f6fd6" font-weight="700">JVM</text><text x="441" y="70" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#5d6678" font-weight="400">interpreter</text><line x1="371" y1="55" x2="384" y2="55" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m9jvm)"/><rect x="512" y="30" width="120" height="50" rx="8" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="572" y="52" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">JIT (C1/C2)</text><text x="572" y="70" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#5d6678" font-weight="400">machine code</text><line x1="497" y1="55" x2="510" y2="55" stroke="#1f9d74" stroke-width="1.6" marker-end="url(#m9jvm)"/><text x="320" y="108" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">الكود «السخن» (اتنفذ كتير) بيتترجم لـ machine code وقت التشغيل</text><text x="320" y="146" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">نفس ملف الـ bytecode بيشتغل على أي جهاز عليه JVM من غير ما تعيد الـ compile</text><text x="320" y="170" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">الـ JIT شايف الكود بيتنفذ فعلًا إزاي، فيقدر يعمل تحسينات الـ compiler العادي ميقدرش يعملها</text><text x="320" y="192" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">(مثلًا: لو كل الـ Course هنا PythonCourse، ينادي الدالة على طول من غير vtable)</text></svg>