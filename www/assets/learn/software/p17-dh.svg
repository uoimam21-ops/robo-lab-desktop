<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="mp17-dh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="250" y="20" width="140" height="34" rx="6" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="320.0" y="41.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">في العلن: p و g</text><rect x="40" y="90" width="150" height="40" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="115.0" y="114.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">علي: سر a</text><rect x="450" y="90" width="150" height="40" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="525.0" y="114.0" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">منى: سر b</text><text x="115" y="152" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">A = g^a mod p</text><text x="525" y="152" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">B = g^b mod p</text><line x1="190" y1="148" x2="450" y2="148" stroke="#2f6fd6" stroke-width="1.3" marker-end="url(#mp17-dh)"/><line x1="450" y1="162" x2="190" y2="162" stroke="#2f6fd6" stroke-width="1.3" marker-end="url(#mp17-dh)"/><text x="115" y="192" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">B^a mod p</text><text x="525" y="192" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">A^b mod p</text><text x="320" y="192" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">= g^(ab) =</text><text x="320" y="220" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">اللي بيتنصت شاف كل الأرقام العلنية، بس عشان يطلّع السر لازم يحل مسألة صعبة جدًا</text></svg>