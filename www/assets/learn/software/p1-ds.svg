<svg direction="ltr" viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic">
  <!-- list -->
  <text x="160" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6fd6">list: خانات متجاورة</text>
  <g font-family="JetBrains Mono" font-size="11">
    <g fill="#eef4ff" stroke="#2f6fd6">
      <rect x="30" y="40" width="52" height="34"/><rect x="82" y="40" width="52" height="34"/><rect x="134" y="40" width="52" height="34"/><rect x="186" y="40" width="52" height="34"/><rect x="238" y="40" width="52" height="34"/>
    </g>
    <g fill="#5d6678" text-anchor="middle"><text x="56" y="90">[0]</text><text x="108" y="90">[1]</text><text x="160" y="90">[2]</text><text x="212" y="90">[3]</text><text x="264" y="90">[4]</text></g>
    <g fill="#1b2130" text-anchor="middle"><text x="56" y="62">'a'</text><text x="108" y="62">'b'</text><text x="160" y="62">'c'</text><text x="212" y="62">'d'</text><text x="264" y="62">'e'</text></g>
  </g>
  <text x="160" y="116" text-anchor="middle" font-size="11" fill="#5d6678" direction="rtl">x[3] ← حساب مباشر: البداية + 3 خانات · O(1)</text>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#d14b4b" direction="rtl">'e' in x ← لازم تلف عليهم واحد واحد · O(n)</text>
  <!-- dict -->
  <text x="480" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1f9d74">dict / set: Hash table</text>
  <g font-family="JetBrains Mono" font-size="11">
    <rect x="345" y="48" width="70" height="28" rx="14" fill="#fff6e5" stroke="#c97c00"/><text x="380" y="66" text-anchor="middle">'Mona'</text>
    <rect x="345" y="90" width="70" height="28" rx="14" fill="#fff6e5" stroke="#c97c00"/><text x="380" y="108" text-anchor="middle">'Ali'</text>
    <text x="442" y="56" fill="#8a92a3" font-size="9.5">hash()</text>
    <g fill="#e9f7f1" stroke="#1f9d74">
      <rect x="500" y="34" width="120" height="22"/><rect x="500" y="56" width="120" height="22"/><rect x="500" y="78" width="120" height="22"/><rect x="500" y="100" width="120" height="22"/><rect x="500" y="122" width="120" height="22"/>
    </g>
    <g fill="#8a92a3" font-size="9.5"><text x="484" y="49">0</text><text x="484" y="71">1</text><text x="484" y="93">2</text><text x="484" y="115">3</text><text x="484" y="137">4</text></g>
    <text x="508" y="93" fill="#1b2130">'Mona' → 92</text><text x="508" y="137" fill="#1b2130">'Ali' → 85</text>
  </g>
  <path d="M417 62 C 450 62, 460 88, 496 88" fill="none" stroke="#c97c00" stroke-width="1.6"/>
  <path d="M417 104 C 450 104, 460 132, 496 132" fill="none" stroke="#c97c00" stroke-width="1.6"/>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#5d6678" direction="rtl">المفتاح بيتحول لرقم خانة على طول · البحث O(1) في المتوسط</text>
  <!-- bottom bar -->
  <rect x="20" y="190" width="600" height="48" rx="10" fill="#f6f7fb"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#1b2130" direction="rtl">البحث عن عنصر في مليون عنصر على جهازنا:</text>
  <text x="320" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2130" direction="rtl">list ≈ 5.5 ملّي ثانية · set ≈ 0.16 ميكرو ثانية · يعني أسرع حوالي 35 ألف مرة</text>
</svg>
