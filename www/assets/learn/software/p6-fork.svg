<svg direction="ltr" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m6fork" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="40" y="50" font-family="JetBrains Mono" text-anchor="start" font-size="11" fill="#2f6fd6" font-weight="700">parent</text><text x="40" y="140" font-family="JetBrains Mono" text-anchor="start" font-size="11" fill="#c97c00" font-weight="700">child</text><line x1="100" y1="46" x2="590" y2="46" stroke="#2f6fd6" stroke-width="4"/><circle cx="190" cy="46" r="6" fill="#1b2130"/><text x="190" y="30" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">fork()</text><path d="M190,52 C200,110 220,136 250,136" fill="none" stroke="#c97c00" stroke-width="2"/><line x1="250" y1="136" x2="330" y2="136" stroke="#c97c00" stroke-width="4"/><text x="290" y="160" direction="rtl" text-anchor="middle" font-size="10" fill="#c97c00" font-weight="400">نسخة من الأب</text><circle cx="330" cy="136" r="6" fill="#1b2130"/><text x="330" y="122" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">exec("echo")</text><line x1="336" y1="136" x2="460" y2="136" stroke="#1f9d74" stroke-width="4"/><text x="398" y="160" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">بقى برنامج تاني</text><circle cx="460" cy="136" r="6" fill="#d14b4b"/><text x="460" y="122" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#d14b4b" font-weight="700">exit(0)</text><rect x="300" y="38" width="160" height="16" fill="#fff" stroke="#2f6fd6" stroke-dasharray="4 3"/><text x="380" y="50" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#2f6fd6" font-weight="700">wait()</text><path d="M460,130 L470,58" fill="none" stroke="#5d6678" stroke-dasharray="4 3" marker-end="url(#m6fork)"/><text x="560" y="96" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">بين fork و exec تقدر تجهّز:</text><text x="560" y="112" direction="rtl" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">redirect، pipes، صلاحيات</text><text x="320" y="190" direction="rtl" text-anchor="middle" font-size="11.5" fill="#1b2130" font-weight="700">fork بيعمل نسخة · exec بيبدّل البرنامج · wait بيستنى الابن</text></svg>