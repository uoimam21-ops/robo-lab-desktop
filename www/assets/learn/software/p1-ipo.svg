<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic" direction="rtl">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5d6678"/></marker></defs>
  <!-- input -->
  <rect x="520" y="70" width="110" height="80" rx="12" fill="#eef4ff" stroke="#2f6fd6"/>
  <text x="575" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#2f6fd6">Input</text>
  <text x="575" y="126" text-anchor="middle" font-size="11.5" fill="#1b2130">كيبورد · ملف · شبكة</text>
  <!-- CPU -->
  <rect x="300" y="50" width="180" height="120" rx="14" fill="#1b2130"/>
  <text x="390" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">CPU · Processing</text>
  <text x="390" y="114" text-anchor="middle" font-size="11.5" fill="#c9d1e6">بينفذ مليارات التعليمات</text>
  <text x="390" y="134" text-anchor="middle" font-size="11.5" fill="#c9d1e6">البسيطة في الثانية</text>
  <text x="390" y="156" text-anchor="middle" font-size="10.5" fill="#8f9bbb" direction="ltr">fetch → decode → execute</text>
  <!-- output -->
  <rect x="10" y="70" width="110" height="80" rx="12" fill="#e9f7f1" stroke="#1f9d74"/>
  <text x="65" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#1f9d74">Output</text>
  <text x="65" y="126" text-anchor="middle" font-size="11.5" fill="#1b2130">شاشة · ملف · صوت</text>
  <!-- storage -->
  <rect x="260" y="200" width="120" height="44" rx="10" fill="#fff6e5" stroke="#c97c00"/>
  <text x="320" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#c97c00">RAM</text>
  <text x="320" y="236" text-anchor="middle" font-size="10" fill="#1b2130">سريعة · بتتمسح</text>
  <rect x="400" y="200" width="120" height="44" rx="10" fill="#fff6e5" stroke="#c97c00"/>
  <text x="460" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#c97c00">Disk / SSD</text>
  <text x="460" y="236" text-anchor="middle" font-size="10" fill="#1b2130">بطيئة · دايمة</text>
  <text x="190" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#c97c00">Storage</text>
  <!-- arrows -->
  <line x1="518" y1="110" x2="484" y2="110" stroke="#5d6678" stroke-width="2.2" marker-end="url(#a2)"/>
  <line x1="298" y1="110" x2="124" y2="110" stroke="#5d6678" stroke-width="2.2" marker-end="url(#a2)"/>
  <line x1="340" y1="172" x2="330" y2="198" stroke="#5d6678" stroke-width="2" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <line x1="440" y1="172" x2="450" y2="198" stroke="#5d6678" stroke-width="2" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text x="390" y="30" text-anchor="middle" font-size="12" fill="#5d6678">أي برنامج في الدنيا = الأربع حاجات دول بس</text>
</svg>
