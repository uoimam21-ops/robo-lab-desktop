<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m9vtable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="80" y="22" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">Course c</text><rect x="20" y="32" width="120" height="40" rx="6" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="80" y="57" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#c97c00" font-weight="700">reference</text><rect x="200" y="20" width="150" height="110" rx="6" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="275" y="14" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="700">object (heap)</text><rect x="210" y="30" width="130" height="24" rx="4" fill="#f3effc" stroke="#7a4fd1" stroke-width="1"/><text x="275" y="46" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#7a4fd1" font-weight="700">header → class</text><text x="275" y="74" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">title = Python</text><text x="275" y="94" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">sessions = 12</text><line x1="142" y1="52" x2="198" y2="52" stroke="#c97c00" stroke-width="1.8" marker-end="url(#m9vtable)"/><rect x="420" y="20" width="200" height="110" rx="6" fill="#fff" stroke="#7a4fd1" stroke-width="1.5"/><text x="520" y="14" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#7a4fd1" font-weight="700">PythonCourse vtable</text><rect x="430" y="30" width="180" height="26" rx="4" fill="#fff" stroke="#c9cfdc" stroke-width="1"/><text x="520" y="47" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#1b2130" font-weight="400">price → Course.price</text><rect x="430" y="62" width="180" height="26" rx="4" fill="#f3effc" stroke="#7a4fd1" stroke-width="1"/><text x="520" y="79" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#1b2130" font-weight="700">pricePerSession → Python…</text><rect x="430" y="94" width="180" height="26" rx="4" fill="#fff" stroke="#c9cfdc" stroke-width="1"/><text x="520" y="111" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#1b2130" font-weight="400">toString → Course.toString</text><line x1="342" y1="42" x2="418" y2="42" stroke="#7a4fd1" stroke-width="1.8" marker-end="url(#m9vtable)"/><text x="320" y="170" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">عشان تنادي pricePerSession: اقرا الـ class من الـ header، وادخل الـ vtable، ونادي الخانة رقم 2</text><text x="320" y="194" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">نفس السطر بينادي دالة مختلفة حسب نوع الـ object الحقيقي وقت التشغيل (dynamic dispatch)</text><text x="320" y="216" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">وده نفس جدول المؤشرات لدوال اللي بنيته بإيدك بـ C في الجزء 5</text></svg>