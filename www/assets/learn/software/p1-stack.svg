<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic">
  <g font-family="JetBrains Mono" font-size="11.5">
    <rect x="10" y="12" width="260" height="206" rx="10" fill="#0f1524"/>
    <text x="24" y="38" fill="#c792ea">def</text><text x="52" y="38" fill="#82aaff">area</text><text x="86" y="38" fill="#e6e9f2">(w, h):</text>
    <text x="40" y="58" fill="#c792ea">return</text><text x="90" y="58" fill="#e6e9f2">w * h</text>
    <text x="24" y="88" fill="#c792ea">def</text><text x="52" y="88" fill="#82aaff">room_cost</text><text x="124" y="88" fill="#e6e9f2">(w, h, price):</text>
    <text x="40" y="108" fill="#e6e9f2">a = area(w, h)</text>
    <rect x="34" y="94" width="120" height="20" rx="4" fill="none" stroke="#ffcb6b"/>
    <text x="40" y="128" fill="#c792ea">return</text><text x="90" y="128" fill="#e6e9f2">a * price</text>
    <text x="24" y="168" fill="#e6e9f2">total = room_cost(4, 5, 300)</text>
    <text x="24" y="188" fill="#e6e9f2">print(total)  </text><text x="134" y="188" fill="#7d88a6"># 6000</text>
  </g>
  <text x="455" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#5d6678" direction="rtl">الـ Call Stack وقت تنفيذ area</text>
  <g font-size="12">
    <rect x="330" y="40" width="250" height="52" rx="8" fill="#e9f7f1" stroke="#1f9d74" stroke-width="2"/>
    <text x="345" y="60" font-weight="700" fill="#1f9d74">area</text><text x="565" y="60" text-anchor="end" fill="#1f9d74" font-size="10.5" direction="rtl">شغالة دلوقتي ⬅</text>
    <text x="345" y="80" font-family="JetBrains Mono" fill="#1b2130">w=4  h=5</text>
    <rect x="330" y="98" width="250" height="52" rx="8" fill="#eef4ff" stroke="#2f6fd6"/>
    <text x="345" y="118" font-weight="700" fill="#2f6fd6">room_cost</text><text x="565" y="118" text-anchor="end" fill="#5d6678" font-size="10.5" direction="rtl">مستنية ترجع قيمة</text>
    <text x="345" y="138" font-family="JetBrains Mono" fill="#1b2130">w=4  h=5  price=300  a=?</text>
    <rect x="330" y="156" width="250" height="52" rx="8" fill="#f1f3f7" stroke="#9aa3b5"/>
    <text x="345" y="176" font-weight="700" fill="#5d6678">&lt;module&gt;</text><text x="565" y="176" text-anchor="end" fill="#5d6678" font-size="10.5" direction="rtl">البرنامج الرئيسي</text>
    <text x="345" y="196" font-family="JetBrains Mono" fill="#1b2130">total=?</text>
  </g>
  <path d="M600 66 V182" stroke="#c4cad6" stroke-width="2"/><path d="M594 76 L600 66 L606 76" fill="none" stroke="#c4cad6" stroke-width="2"/>
  <text x="614" y="130" font-size="10.5" fill="#8a92a3" transform="rotate(-90 614 130)" text-anchor="middle">push</text>
</svg>
