<g font-family="Readex Pro" direction="rtl" font-size="12.5" fill="#1b2130"><text x="630" y="50" text-anchor="start">كل رقم = مجموع الرقمين اللي فوقه</text><text x="630" y="78" text-anchor="end" direction="ltr" font-family="JetBrains Mono" font-size="12">C(6,2) = C(5,1) + C(5,2) = 5 + 10 = 15</text><text x="630" y="118" text-anchor="start">C(6,2) = عدد الطرق تختار 2 من 6</text><text x="630" y="146" text-anchor="start">يا إما الشخص رقم 6 معاك (اختار 1 من الـ 5 الباقيين)</text><text x="630" y="170" text-anchor="start">يا إما مش معاك (اختار 2 من الـ 5)</text><text x="630" y="206" text-anchor="start" fill="#5d6678" font-size="11.5">ده نفسه شكل الـ recursion · ومجموع الصف n = 2ⁿ</text></g></svg>