<svg direction="ltr" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic">
  <g font-size="11" fill="#5d6678" direction="ltr">
    <text x="20" y="24">step</text><text x="80" y="24">interval [low, high]</text>
  </g>
  <!-- axis labels -->
  <g font-family="JetBrains Mono" font-size="10" fill="#8a92a3" direction="ltr">
    <text x="190" y="214" text-anchor="middle">0</text><text x="340" y="214" text-anchor="middle">12.5</text><text x="490" y="214" text-anchor="middle">25</text>
  </g>
  <line x1="190" y1="200" x2="490" y2="200" stroke="#c4cad6"/>
  <line x1="250" y1="34" x2="250" y2="200" stroke="#d14b4b" stroke-dasharray="3 3"/>
  <text x="250" y="226" text-anchor="middle" font-size="10.5" fill="#d14b4b" direction="ltr">√25 = 5</text>
  <g font-family="JetBrains Mono" font-size="11" direction="ltr">
    <text x="30" y="50">1</text><rect x="190" y="40" width="300" height="14" rx="4" fill="#2f6fd6" opacity=".85"/><circle cx="340" cy="47" r="4" fill="#fff"/><text x="505" y="51" fill="#5d6678">mid=12.5 → too big</text>
    <text x="30" y="78">2</text><rect x="190" y="68" width="150" height="14" rx="4" fill="#2f6fd6" opacity=".75"/><circle cx="265" cy="75" r="4" fill="#fff"/><text x="505" y="79" fill="#5d6678">mid=6.25 → too big</text>
    <text x="30" y="106">3</text><rect x="190" y="96" width="75" height="14" rx="4" fill="#2f6fd6" opacity=".65"/><circle cx="227.5" cy="103" r="4" fill="#fff"/><text x="505" y="107" fill="#5d6678">mid=3.125 → too small</text>
    <text x="30" y="134">4</text><rect x="227.5" y="124" width="37.5" height="14" rx="4" fill="#2f6fd6" opacity=".55"/><circle cx="246" cy="131" r="4" fill="#fff"/><text x="505" y="135" fill="#5d6678">mid=4.69 → too small</text>
    <text x="30" y="162">5</text><rect x="246" y="152" width="19" height="14" rx="4" fill="#2f6fd6" opacity=".45"/><text x="505" y="163" fill="#5d6678">…</text>
    <text x="30" y="190">n</text><rect x="248" y="182" width="4" height="10" rx="1" fill="#1f9d74"/><text x="505" y="191" fill="#1f9d74">width &lt; eps ✓</text>
  </g>
</svg>
