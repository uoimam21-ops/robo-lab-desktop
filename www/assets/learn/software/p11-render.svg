idth="1.5"/><text x="413" y="90" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">layout</text><line x1="353" y1="85" x2="373" y2="85" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m11render)"/><rect x="463" y="65" width="76" height="40" rx="6" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="501" y="90" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">paint</text><line x1="441" y1="85" x2="461" y2="85" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m11render)"/><rect x="551" y="65" width="76" height="40" rx="6" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="589" y="90" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">composite</text><line x1="529" y1="85" x2="549" y2="85" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m11render)"/><text x="470" y="130" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">فين كل عنصر؟ ← ارسم البكسلات ← ركّب الطبقات</text><text x="320" y="170" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">الـ JavaScript بيقدر يغيّر الـ DOM في أي لحظة، والمتصفح يعيد الخطوات من أول ما اتغير</text><text x="320" y="190" direction="rtl" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="400">تغيير لون = paint بس. تغيير مقاس = layout + paint لكل اللي حواليه (أغلى)</text></svg>