<svg direction="ltr" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m11loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="20" y="30" width="140" height="150" rx="8" fill="#fff" stroke="#1b2130" stroke-width="1.5"/><text x="90" y="22" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">call stack</text><rect x="32" y="130" width="116" height="28" rx="4" fill="#fff6e5" stroke="#c97c00" stroke-width="1"/><text x="90" y="148" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">while (busy)…</text><rect x="32" y="96" width="116" height="28" rx="4" fill="#fff" stroke="#c9cfdc" stroke-width="1"/><text x="90" y="114" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">main script</text><rect x="250" y="30" width="360" height="50" rx="8" fill="#f3effc" stroke="#7a4fd1" stroke-width="1.5"/><text x="430" y="22" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#7a4fd1" font-weight="700">microtask queue (Promises)</text><rect x="262" y="42" width="120" height="26" rx="4" fill="#fff" stroke="#7a4fd1" stroke-width="1"/><text x="322" y="59" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">then(...)</text><rect x="250" y="120" width="360" height="50" rx="8" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="430" y="112" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#2f6fd6" font-weight="700">task queue (setTimeout, clicks, fetch)</text><rect x="262" y="132" width="120" height="26" rx="4" fill="#fff" stroke="#2f6fd6" stroke-width="1"/><text x="322" y="149" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">timeout 0</text><rect x="392" y="132" width="120" height="26" rx="4" fill="#fff" stroke="#2f6fd6" stroke-width="1"/><text x="452" y="149" font-family="JetBrains Mono" text-anchor="middle" font-size="9.5" fill="#1b2130" font-weight="400">timer 10 ms</text><line x1="248" y1="55" x2="162" y2="80" stroke="#7a4fd1" stroke-width="1.6" marker-end="url(#m11loop)"/><line x1="248" y1="145" x2="162" y2="120" stroke="#2f6fd6" stroke-width="1.6" marker-end="url(#m11loop)"/><text x="205" y="64" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#7a4fd1" font-weight="700">1st</text><text x="205" y="145" font-family="JetBrains Mono" text-anchor="middle" font-size="9" fill="#2f6fd6" font-weight="700">2nd</text><text x="320" y="205" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">فيه thread واحد بس: لما الـ stack يفضى، خلّص كل الـ microtasks الأول، وبعدين task واحدة، وكرر</text></svg>