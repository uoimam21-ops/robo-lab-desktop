<svg direction="ltr" viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m13pnp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><ellipse cx="300" cy="125" rx="270" ry="105" fill="#fff6e5" stroke="#c97c00" stroke-width="1.8"/><ellipse cx="200" cy="135" rx="140" ry="70" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.8"/><ellipse cx="460" cy="125" rx="95" ry="62" fill="#fdecec" stroke="#d14b4b" stroke-width="1.8"/><text x="300" y="40" font-family="Readex Pro, IBM Plex Sans Arabic" text-anchor="middle" font-size="11" fill="#c97c00" font-weight="700">NP: الحل سهل تتأكد منه</text><text x="200" y="100" font-family="Readex Pro, IBM Plex Sans Arabic" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">P: سهل تحله</text><text x="200" y="125" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">sorting · shortest path</text><text x="200" y="145" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">primality (AKS 2002)</text><text x="200" y="165" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">2-SAT · matching</text><text x="460" y="100" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#d14b4b" font-weight="700">NP-complete</text><text x="460" y="125" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">SAT · 3-coloring</text><text x="460" y="145" font-family="JetBrains Mono" text-anchor="middle" font-size="10" fill="#1b2130" font-weight="400">TSP (decision) · Sudoku n×n</text><text x="320" y="254" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">لو حد لقى حل سريع لأي واحدة حمرا، كل NP بقت P. ومحدش عارف، وفيه مليون دولار للي يعرف</text></sv