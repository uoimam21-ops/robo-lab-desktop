<svg direction="ltr" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m14uaf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="110" y="24" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">1. malloc + strcpy</text><rect x="40" y="50" width="140" height="40" rx="6" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.6"/><text x="110" y="76" font-family="JetBrains Mono" text-anchor="middle" font-size="13" fill="#1f9d74" font-weight="700">Ali</text><text x="110" y="112" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">name ← هنا</text><line x1="190" y1="70" x2="248" y2="70" stroke="#5d6678" stroke-width="1.4" marker-end="url(#m14uaf)"/><text x="320" y="24" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">2. free(name)</text><rect x="250" y="50" width="140" height="40" rx="6" fill="#f3f4f7" stroke="#5d6678" stroke-width="1.6"/><text x="320" y="76" font-family="JetBrains Mono" text-anchor="middle" font-size="13" fill="#5d6678" font-weight="700">Ali</text><text x="320" y="112" direction="rtl" text-anchor="middle" font-size="10" fill="#5d6678" font-weight="700">name لسه بيشاور!</text><line x1="400" y1="70" x2="458" y2="70" stroke="#5d6678" stroke-width="1.4" marker-end="url(#m14uaf)"/><text x="530" y="24" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">3. malloc + strcpy</text><rect x="460" y="50" width="140" height="40" rx="6" fill="#fdecec" stroke="#d14b4b" stroke-width="1.6"/><text x="530" y="76" font-family="JetBrains Mono" text-anchor="middle" font-size="13" fill="#d14b4b" font-weight="700">HACKED</text><text x="530" y="112" direction="rtl" text-anchor="middle" font-size="10" fill="#d14b4b" font-weight="700">other ← نفس المكان</text><text x="320" y="160" direction="rtl" text-anchor="middle" font-size="11" fill="#d14b4b" font-weight="700">لغة C طبعت name عادي، وطلع HACKED: البيانات اتغيرت من غير ما حد يلمسها</text><text x="320" y="184" direction="rtl" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="400">لغة Rust بترفض البرنامج ده وقت الـ compile، وفي Java و Python الـ GC مبيرجّعش المكان طول ما حد بيشاور عليه</text></svg>