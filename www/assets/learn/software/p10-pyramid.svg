<svg direction="ltr" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m10pyramid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><polygon points="110.0,70 230.0,70 205.0,20 135.0,20" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="170" y="50" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#d14b4b" font-weight="700">E2E / UI</text><text x="620" y="50" direction="rtl" text-anchor="start" font-size="10.5" fill="#1b2130" font-weight="400">قليلة، بطيئة، بتختبر كل حاجة مع بعض</text><polygon points="60.0,125 280.0,125 255.0,75 85.0,75" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="170" y="105" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#c97c00" font-weight="700">Integration</text><text x="620" y="105" direction="rtl" text-anchor="start" font-size="10.5" fill="#1b2130" font-weight="400">أكتر: مكونين أو مع DB حقيقية</text><polygon points="10.0,180 330.0,180 305.0,130 35.0,130" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="170" y="160" font-family="JetBrains Mono" text-anchor="middle" font-size="11" fill="#1f9d74" font-weight="700">Unit</text><text x="620" y="160" direction="rtl" text-anchor="start" font-size="10.5" fill="#1b2130" font-weight="400">كتير جدًا، سريعة (ملي ثانية)، دالة أو class</text><text x="320" y="200" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">كل ما تطلع لفوق: ثقة أكتر في إن «النظام كله شغال»، بس أبطأ وأغلى وأصعب تعرف العيب فين</text></svg>