<svg direction="ltr" viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m13hierarchy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><ellipse cx="300" cy="145" rx="295" ry="135" fill="#fafbfd" stroke="#c9cfdc" stroke-width="1.6"/><ellipse cx="300" cy="152" rx="240" ry="107" fill="#f3effc" stroke="#7a4fd1" stroke-width="1.6"/><ellipse cx="300" cy="160" rx="180" ry="80" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.6"/><ellipse cx="300" cy="167" rx="115" ry="48" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.6"/><text x="300" y="26" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1b2130" font-weight="700">Recognizable (Turing machine)</text><text x="300" y="41" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">halting: «هيقف؟» لو وقف بتعرف</text><text x="300" y="61" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#7a4fd1" font-weight="700">Decidable (always halts)</text><text x="300" y="76" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">هل الرقم أولي؟ هل الجملة دي صح نحويًا؟</text><text x="300" y="96" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#2f6fd6" font-weight="700">Context-free (stack)</text><text x="300" y="111" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">أقواس متوازنة، تعبيرات رياضية، كود</text><text x="300" y="135" font-family="JetBrains Mono" text-anchor="middle" font-size="10.5" fill="#1f9d74" font-weight="700">Regular (DFA, regex)</text><text x="300" y="150" direction="rtl" text-anchor="middle" font-size="9.5" fill="#5d6678" font-weight="400">رقم تليفون، يقبل القسمة على 3</text><text x="620" y="18" direction="rtl" text-anchor="start" font-size="10" fill="#d14b4b" font-weight="700">برا الكل: مسائل مفيش برنامج يحلها</text></svg>