<svg direction="ltr" viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m6irq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><rect x="530" y="50" width="96" height="46" rx="8" fill="#eef3fd" stroke="#2f6fd6" stroke-width="1.5"/><text x="578" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#2f6fd6" font-weight="700">زرار اتداس</text><line x1="530" y1="73" x2="526" y2="73" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m6irq)"/><rect x="428" y="50" width="96" height="46" rx="8" fill="#fdecec" stroke="#d14b4b" stroke-width="1.5"/><text x="476" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#d14b4b" font-weight="700">Interrupt</text><line x1="428" y1="73" x2="424" y2="73" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m6irq)"/><rect x="326" y="50" width="96" height="46" rx="8" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="374" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#c97c00" font-weight="700">يحفظ مكانه</text><line x1="326" y1="73" x2="322" y2="73" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m6irq)"/><rect x="224" y="50" width="96" height="46" rx="8" fill="#fff6e5" stroke="#c97c00" stroke-width="1.5"/><text x="272" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#c97c00" font-weight="700">handler</text><line x1="224" y1="73" x2="220" y2="73" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m6irq)"/><rect x="122" y="50" width="96" height="46" rx="8" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="170" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">buffer</text><line x1="122" y1="73" x2="118" y2="73" stroke="#5d6678" stroke-width="1.6" marker-end="url(#m6irq)"/><rect x="20" y="50" width="96" height="46" rx="8" fill="#eaf6f1" stroke="#1f9d74" stroke-width="1.5"/><text x="68" y="78" direction="rtl" text-anchor="middle" font-size="10" fill="#1f9d74" font-weight="700">Ready</text><text x="320" y="30" direction="rtl" text-anchor="middle" font-size="11.5" fill="#1b2130" font-weight="700">بدل ما الـ CPU يسأل كل شوية (polling)، الجهاز «بيرن الجرس» لما يجهز</text><text x="320" y="128" direction="rtl" text-anchor="middle" font-size="10.5" fill="#5d6678" font-weight="400">كل ده بياخد ميكروثواني، والبرنامج نفسه مش حاسس إنه اتوقف</text></svg>