<svg direction="ltr" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" font-family="Readex Pro, IBM Plex Sans Arabic"><defs><marker id="m20phack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6678"/></marker></defs><text x="200" y="41" font-family="JetBrains Mono" text-anchor="end" font-size="10.5" fill="#1b2130" font-weight="700">one outcome, decided before</text><rect x="210" y="25" width="20" height="22" rx="4" fill="#1f9d74" opacity=".85"/><text x="235.9142857142857" y="41" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#1f9d74" font-weight="700">4.1%</text><text x="200" y="75" font-family="JetBrains Mono" text-anchor="end" font-size="10.5" fill="#1b2130" font-weight="700">best of 20 outcomes</text><rect x="210" y="59" width="315" height="22" rx="4" fill="#d14b4b" opacity=".85"/><text x="531.2285714285715" y="75" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#d14b4b" font-weight="700">64.9%</text><text x="200" y="109" font-family="JetBrains Mono" text-anchor="end" font-size="10.5" fill="#1b2130" font-weight="700">best of 20 + Bonferroni</text><rect x="210" y="93" width="22" height="22" rx="4" fill="#1f9d74" opacity=".85"/><text x="237.85714285714286" y="109" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#1f9d74" font-weight="700">4.5%</text><text x="200" y="143" font-family="JetBrains Mono" text-anchor="end" font-size="10.5" fill="#1b2130" font-weight="700">peek every 10, stop at p<0.05</text><rect x="210" y="127" width="90" height="22" rx="4" fill="#d14b4b" opacity=".85"/><text x="306.34285714285716" y="143" font-family="JetBrains Mono" text-anchor="start" font-size="10.5" fill="#d14b4b" font-weight="700">18.6%</text><text x="320" y="168" direction="rtl" text-anchor="middle" font-size="11" fill="#1b2130" font-weight="700">نسبة الدراسات اللي «لقت أثر» مع إن مفيش أي أثر حقيقي</text></svg>